<style>
:root{--bg:#10131a;--card:#1a1f2b;--card2:#222939;--line:#2d3548;--tx:#eef1f7;--mut:#9aa6bd;--acc:#ffd23f;--good:#4ade80;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--acc)}
header{max-width:1000px;margin:0 auto;padding:0 0 8px}
.hero{position:relative;aspect-ratio:992/340;background:url(assets/hero-banner.jpg?v=1) center 14%/cover no-repeat;border-radius:0 0 18px 18px;overflow:hidden}
.titlebar{padding:12px 14px 4px;text-align:left}
.titlebar .tag{margin:6px 0 0;color:#e7ecf6}
.fresh{display:flex;width:fit-content;max-width:100%;align-items:center;min-height:40px;margin:-6px 0 -8px;padding:6px 14px 6px 0;font-size:12px;line-height:1.3;color:var(--mut);opacity:.55;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.fresh[hidden]{display:none}
.fresh:hover{opacity:.85}
.fresh:focus-visible{opacity:.9;outline:1px dashed var(--mut);outline-offset:-2px;border-radius:6px}
.sub{padding:0 14px}
@media (max-width:640px){.hero{aspect-ratio:16/10;background-image:url(assets/hero-banner.jpg?v=1);background-position:center 8%}}
/*<S26F-SHORT-HERO>*/ /* header photo capped to under half its old height (was 992/340 desktop = ~343px, 16/10 phone = ~244px at 390); same cover-cropped background as before, only the height changes */
.hero{aspect-ratio:auto;height:clamp(110px,15vw,160px);background-position:center 32%}
@media (max-width:640px){.hero{aspect-ratio:auto;height:clamp(84px,29vw,118px);background-position:center 18%}}
/*</S26F-SHORT-HERO>*/
h1{color:var(--acc);margin:0;font-size:clamp(34px,9vw,56px);letter-spacing:.04em;font-weight:900;line-height:1}
h1 span{color:var(--acc)}
.tag{color:var(--mut);margin:6px 0 0}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line);margin:8px 6px 0 0}
.badge.warn{background:#4b3a0b;border-color:#8a6d12;color:#ffe08a}
/*<NAV-ONE-ROW>*/
/* All tabs on ONE row, never wrapping or scrolling. Phone: tiny icon above a short label (full name stays in aria-label). Desktop (>=900px): full labels in pills. */
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 4px;display:flex;flex-wrap:nowrap;gap:2px;overflow:hidden;max-width:1000px;margin:8px auto 0}
nav button{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:4px 0;min-height:46px;font:inherit;font-size:9.5px;font-weight:800;letter-spacing:-.01em;line-height:1.05;white-space:nowrap;cursor:pointer}
nav button .ni{font-size:17px;line-height:1}
nav button .nl{display:block;max-width:100%;overflow:hidden;text-overflow:clip}
nav button .nl.f{display:none}
nav button.on{background:var(--acc);color:#111;border-color:var(--acc)}
nav button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
@media (max-width:370px){nav{padding:6px 2px;gap:1px}nav button{font-size:8.8px;letter-spacing:-.025em}}
@media (min-width:900px){nav{padding:8px 10px;gap:5px}nav button{flex:1 1 auto;flex-direction:row;gap:6px;border-radius:99px;padding:8px 10px;min-height:40px;font-size:13px;letter-spacing:0}nav button .ni{font-size:14px}nav button .nl.f{display:block}nav button .nl.s{display:none}}
/*</NAV-ONE-ROW>*/
/*<DRAFT-TAB>*/
/* "Draft" is an external link (<a class="nd">) styled like the tab buttons. 10 items now: phone labels get shorter (see NAVSHORT below), full labels only from 1040px. */
nav a.nd{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card);color:var(--tx);border:1px dashed var(--acc);border-radius:9px;padding:4px 0;min-height:46px;font:inherit;font-size:9.5px;font-weight:800;letter-spacing:-.01em;line-height:1.05;white-space:nowrap;cursor:pointer;text-decoration:none}
nav a.nd .ni{font-size:17px;line-height:1}
nav a.nd .nl{display:block;max-width:100%;overflow:hidden;text-overflow:clip}
nav a.nd .nl.f{display:none}
nav a.nd:hover{background:var(--card2)}
nav a.nd:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
@media (max-width:420px){nav{padding:6px 2px;gap:1px}}
@media (max-width:370px){nav a.nd{font-size:8.8px;letter-spacing:-.025em}}
@media (max-width:340px){nav button,nav a.nd{font-size:8.2px;letter-spacing:-.03em}}
@media (min-width:600px) and (max-width:1039px){nav{padding:6px 4px;gap:2px}nav button,nav a.nd{flex:1 1 0;flex-direction:column;gap:2px;border-radius:9px;padding:4px 0;min-height:46px;font-size:11.5px;letter-spacing:-.01em}nav button .ni,nav a.nd .ni{font-size:19px}nav button .nl.f,nav a.nd .nl.f{display:none}nav button .nl.s,nav a.nd .nl.s{display:block}}
@media (min-width:1040px){nav{padding:8px 8px;gap:3px}nav button,nav a.nd{flex:1 1 auto;flex-direction:row;gap:4px;border-radius:99px;padding:8px 8px;min-height:40px;font-size:12.5px;letter-spacing:0}nav button .ni,nav a.nd .ni{font-size:14px}nav button .nl.f,nav a.nd .nl.f{display:block}nav button .nl.s,nav a.nd .nl.s{display:none}}
/*</DRAFT-TAB>*/
main{max-width:1000px;margin:0 auto;padding:12px 10px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;overflow-wrap:anywhere}
.lb{display:flex;align-items:center;gap:10px;cursor:pointer}
.rank{font-size:26px;font-weight:900;width:46px;text-align:center;color:var(--acc)}
.who{flex:1;min-width:0}
.who b{font-size:17px}
.who small{display:block;color:var(--mut)}
.who .gold{display:block;font-size:12px;line-height:1.3;color:var(--mut);font-weight:400;white-space:nowrap;letter-spacing:1px}
.pts{font-size:28px;font-weight:900;text-align:right}
.pts small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.bar{height:6px;background:var(--card2);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{text-decoration:none;display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 2px;border-radius:99px;font-weight:700;font-size:12.5px;border:2px solid transparent;max-width:100%}
.chip img,.chip .nologo{width:22px;height:22px;border-radius:50%;background:#fff;object-fit:contain;padding:1px;flex:none}
.chip .nologo{display:inline-flex;align-items:center;justify-content:center;background:#e2e8f0;color:#1e293b;font-size:9px;font-weight:900;letter-spacing:-.02em;line-height:1}
.chip.big .nologo{font-size:11px}
.chip:hover{filter:brightness(1.12)}
/*<RANK-CHIPS>*/
/* Ranks tab (tidy): every card is the same height. Phones (<700px): row 1 = rank | name + team-name subtitle | points, then an equal-width chip grid (4 columns, 3 below 340px, rows fixed at 32px). Team names wrap to 2 lines inside the chip instead of being cut off. >=700px (RANK-BESIDE below): rank | name | points | chips as true columns shared by all cards (CSS subgrid), so points and chips line up vertically. Markup: cards wrapped in .ocl, chip name in span.cn. Links/JS unchanged. */
.card.oc{display:grid;grid-template-columns:46px minmax(0,1fr) auto;grid-template-areas:"rank who pts" "bar bar bar" "chips chips chips";column-gap:10px;align-items:center}
.card.oc .lb{display:contents}
.card.oc .rank{grid-area:rank}
.card.oc .who{grid-area:who}
.card.oc .pts{grid-area:pts}
.card.oc .bar{grid-area:bar}
.card.oc .chips{grid-area:chips;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:32px;gap:4px;margin-top:8px;align-self:stretch;--rows:2;min-height:calc(var(--rows)*32px + (var(--rows) - 1)*4px);align-content:start}
.card.oc .chip{display:flex;align-items:center;gap:3px;min-width:0;max-width:none;height:32px;box-sizing:border-box;padding:0 3px 0 2px;font-size:9.5px;letter-spacing:-.02em;line-height:1.1;overflow:hidden}
.card.oc .chip img,.card.oc .chip .nologo{width:17px;height:17px;margin:0;flex:none;padding:1px}
.card.oc .chip .nologo{font-size:7px}
.card.oc .chip .cn{min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:normal;word-break:normal;text-align:left}
.card.oc .chip .cn.one{display:block;white-space:nowrap;text-overflow:ellipsis}
@media (max-width:339px){.card.oc .chips{grid-template-columns:repeat(3,minmax(0,1fr));--rows:3}}
/*</RANK-CHIPS>*/
/*<WHO-CENTER>*/@media (max-width:600px){.card.oc .who{text-align:center;overflow-wrap:anywhere}.card.oc .who small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}/*</WHO-CENTER>*/

/*<QB-BOLT>*/.qb-bolt{display:inline-block;vertical-align:-.125em;flex:none;margin-right:.35em}/*</QB-BOLT>*/
/*<RANK-BESIDE>*/
/* >=700px only: one shared 4-column track set (rank | name | points | chips) for the whole list via subgrid, so names, points and chip grids line up in every card; name column is as wide as the longest name (max 230px), points column right-aligned. */
@media (min-width:700px){
  .ocl{display:grid;grid-template-columns:56px fit-content(230px) auto minmax(0,1fr);column-gap:12px;margin-top:10px}
  .ocl>.card.oc{grid-column:1/-1;grid-template-columns:56px 200px 64px minmax(0,1fr);grid-template-areas:"rank who pts chips" "bar bar bar bar";column-gap:12px}
  @supports (grid-template-columns:subgrid){.ocl>.card.oc{grid-template-columns:subgrid}}
  .card.oc .pts{justify-self:end;text-align:right}
  .card.oc .chips{margin-top:0}
  .card.oc .bar{margin-top:8px}
  .card.oc .chip{font-size:11.5px;letter-spacing:0;padding:0 6px 0 2px;gap:4px}
  .card.oc .chip img,.card.oc .chip .nologo{width:20px;height:20px}
  .ocl>.card.oc{margin:0 0 10px}
}
@media (min-width:1000px){.card.oc .chip{font-size:12.5px}}
/*</RANK-BESIDE>*/
/*<CHIP-RECORD>*/
/* Standings chips: the team's W-L (data.json "records": completed regular-season + conference games, same number as the Teams tab) sits inside the chip on its own small line under the school name (logo spans both lines). Chip rows are 40px instead of 32px to make room. A team with no completed game is not in "records" and shows 0-0; if the data has no "records" key at all, no record is shown. */
.card.oc .chips{grid-auto-rows:40px;min-height:calc(var(--rows)*40px + (var(--rows) - 1)*4px)}
.card.oc .chip{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;align-content:center;align-items:center;column-gap:3px;row-gap:0;height:40px}
.card.oc .chip img,.card.oc .chip .nologo{grid-row:1/3;align-self:center}
.card.oc .chip .cn{grid-column:2}
.card.oc .chip .cr{grid-column:2;display:block;font-size:.92em;font-weight:600;line-height:1.1;letter-spacing:0;white-space:nowrap;font-variant-numeric:tabular-nums;opacity:.85;text-align:left;margin-top:1px}
.card.oc .chip .cn.one{align-self:end}
/*</CHIP-RECORD>*/
/*<CHIP-FIT>*/
/* Standings chips: the school name stays on ONE line (never wraps). chipFit() (JS, after every render / resize) shrinks the name font a step at a time until it fits the chip (floor 9px); only a name that still does not fit at 9px is cut with an ellipsis (the whole chip link title and the text keep the full name). Chip size / width / height unchanged. */
.card.oc .chip .cn{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/*</CHIP-FIT>*/
.chip.big{font-size:15px;padding:3px 11px 3px 3px}
.chip.big img{width:30px;height:30px}
.chip.out{opacity:.55;text-decoration:line-through}

/* On GitHub Pages there is no server, so new/settled bets live in ONE small anonymous JSON document (config.json -> shared_bets).

const SH={cfg:null,state:DEMO?'demo':'init',doc:null,err:'',fromBackup:false,busy:false,sig:'',at:null,mine:[],settleMs:1200};
const netErr=(m,e)=>{const x=new Error(m+(e&&e.message?' ('+e.message+')':''));x.net=true;return x};
async function sharedGet(cfg){
  let r;
  try{r=await fetch(cfg.url,{cache:'no-store'})}catch(e){throw netErr('could not reach the shared ledger',e)}
  if(!r.ok)throw netErr('shared ledger answered HTTP '+r.status);
  let d;
  try{d=JSON.parse(await r.text());if(typeof d==='string')d=JSON.parse(d)}catch(e){throw netErr('shared ledger returned something that is not JSON')}
  if(!d||typeof d!=='object'||!Array.isArray(d.bets))throw netErr("shared ledger document has no 'bets' list");
  return d;
}
async function sharedPut(cfg,doc){
  const kind=cfg.kind||'textdb';
  const method=cfg.write_method||({textdb:'POST',jsonblob:'PUT',npoint:'POST'}[kind]||'PUT');
  const ct=cfg.write_content_type||(kind==='textdb'?'text/plain':'application/json');   // text/plain = a "simple" CORS request, no preflight
  let r;
  try{r=await fetch(cfg.url,{method,headers:{'Content-Type':ct},body:JSON.stringify(doc)})}catch(e){throw netErr('could not reach the shared ledger',e)}
  if(!r.ok)throw netErr('shared ledger refused the save (HTTP '+r.status+')');

async function sharedWrite(mutate,verify){
  let last=null;
  for(let i=0;i<3;i++){
    const doc=await sharedGet(SH.cfg);              // freshest copy right before writing
    const nd=mutate(doc);
    if(nd===null){if(verify(doc))return doc}        // nothing to change (someone/an earlier try already did it)
    else{
      nd.schema=1;nd.updated_at=new Date().toISOString();
      await sharedPut(SH.cfg,nd);
      const chk=await sharedGet(SH.cfg);            // read back: did our change survive?
      if(verify(chk)){
        await new Promise(r=>setTimeout(r,SH.settleMs));   // ...and once more a moment later (catches a concurrent writer that read before our PUT)
        const c2=await sharedGet(SH.cfg);
        if(verify(c2))return c2;

    last=new Error('someone else saved at the same moment - please try again');
    await new Promise(r=>setTimeout(r,400+Math.random()*600));
  }
  throw last;
}

async function sharedReload(force){

  <div class="card"><b>Write it Up</b><p>Use this when the bet is already agreed. It goes straight onto <b>All Bets</b>. Pick who you’re against, write the bet, choose the amount and the odds, then <b>5. When can this be settled?</b> That date, <b>End of season</b>, or <b>Not sure yet</b> is for sorting only. Tap <b>Place bet</b>, check it, then <b>Yes, place it</b>.</p></div>
  <div class="card"><b>Request a bet</b><p>Use this when nothing is agreed yet. Pick who it is open to. Leave them unpicked, or choose <b>All</b>, and it is open to the other Stoops. A shorter list is only those invitees. Set how many can accept, and when the invitation expires. Expiry is not the settlement estimate. Then <b>7. When can this be settled?</b>, same three sorting choices. Tap <b>Request bet</b>. It stays under <b>Open requests</b> at the top of <b>All Bets</b> until someone accepts, it expires, or you delete or close it.</p></div>
  <div class="card"><b>Who sees an open request</b><p>The page shows an open request to the Stoop who sent it, and to invitees who can still take it. Other Stoops do not get that card or a request badge. A guest does not see those cards. Accept still only works for an invitee. This is how the page filters the list. The request record itself is still read as one shared list, so the page is not a private lock.</p></div>
  <div class="card"><b>After it is agreed</b><p>An accepted request becomes a bet on <b>All Bets</b>, same as Write it Up. The description, people, amount, and odds stay as written. <b>Edit</b> on an open bet only changes the sorting note. The person who posted it enters who won, or <b>Wash</b>, and confirms. If the words match a finished game, the score can propose a result; nothing changes until they tap <b>Confirm</b>. They can correct a settled result. <b>My turn</b> under Action needed is for those result actions. <a href="${esc(s24Href('howto'))}" onclick="return s24HowFilters(event)">How the filters work →</a></p></div></section>
  <div class="card"><b>Settling</b><p>The person who posted the bet enters who won, or a Wash. A proposed score waits for their Confirm. They can correct a settled result. Totals stay on the <b>Tally</b> page. Settled bets are listed there, under the charts.</p></div>
  <section id="howto-pool" class="s29-hnb"><h3>Pools</h3><div class="card"><b>Pool / buy-in</b><p>Pick <b>Pool</b> (phone) or <b>Pool / buy-in</b> at the top of Write it Up for a buy-in pool.</p></div>
  <div class="card"><b>1. What’s the pool?</b><p>Say what the pool is, e.g. “STOOPIDS season-long tournament pool”.</p></div>
  <div class="card"><b>2. Who’s in?</b><p>You’re in automatically. Tap everyone else who’s in (<b>Select all</b> / <b>Clear</b> work here too).</p></div>
  <div class="card"><b>3. Buy-in per person</b><p>A whole number, minimum ${m}. The pot is buy-in × people in.</p></div>
  <div class="card"><b>4. Payouts by place</b><p>Amounts only; you pick who finished where when you settle it. They must add up to the pot. Optional: leave blank to fill in when it’s over.</p></div></section>
  <div class="card"><b>Pending requests</b><p>Pending requests sit at the top of <b>All Bets</b>. The badge counts unseen requests for this account only. An agreed bet that is not settled is an <b>Unsettled bet</b>, not a pending request.</p></div>
  <section id="howto-filters" class="s29-hnb"><h3>How the All Bets filters work</h3>
  <div class="card"><b>This update only</b><p>This is how the filters work in this held update. They are not on the public site yet. Nothing here settles a bet by itself.</p></div>
  <div class="card"><b>Three controls</b><p><b>Everyone / a person</b> and <b>search</b> stay. <b>Status</b> is All, Needs action, or Unsettled. All Bets opens on <b>All</b>. <b>When</b> is Any time, End Of Game, End Of Season, Not Sure Yet, or Set A Date. Any time is the default.</p></div>
  <div class="card"><b>Status</b><p><b>All</b> is every agreed bet. <b>Needs action</b> is a real step with your name on it: answer a correction, confirm a proposed score, or enter a result after the game is final. <b>Unsettled</b> means agreed and not settled yet. A pool whose payouts are already entered is not unsettled. Settled and washed bets are listed on Tally.</p></div>
  <div class="card"><b>When</b><p>These are the same settle choices as the bet form. <b>End Of Game</b> and <b>End Of Season</b> are those labels. <b>Not Sure Yet</b> has no settle time. <b>Set A Date</b> is a bet with a chosen date. None of these choices settles the bet by itself.</p></div>
  <div class="card"><b>Requests stay separate</b><p>Open requests stay in their own list at the top of All Bets. Status, Action needed, and When do not try to classify a request. Everyone, Me, a named person, and search do apply to that list, but only after the page has already hidden requests you cannot see. You see a request you sent, or one you were invited to and can still take. You never see someone else’s request just because you searched their name. A guest does not see those cards.</p></div>
  <div class="card"><b>Three examples</b><p>Needs action: the game is final and you still need to confirm the proposed score, or enter the result because the final did not propose one. A game that has not finished does not.</p><p>Unsettled: the bet is agreed and nobody has entered the result yet.</p><p>All + End Of Season: those bets use that settle label. They do not settle when the season ends, because no end date is on file.</p></div>
  </section>
  <div class="card"><b>Copy</b><p>Each bet’s <b>Copy</b> button copies just that bet’s text.</p></div></div>`}

const PT=(k,v)=>String(POOL_TXT[k]).replace(/\{(\w+)\}/g,(_,n)=>v&&n in v?v[n]:'');
const POOL_MAX=1e9;
const b27Key=n=>String(n).toLowerCase().replace(/[^a-z0-9]+/g,'');
function b27PoolKeys(names){const m={};names.forEach(n=>{const w=String(n).split(/\s+/).filter(Boolean);m[n]=b27Key(w[w.length-1]||n)});const c={};Object.values(m).forEach(k=>c[k]=(c[k]||0)+1);names.forEach(n=>{if(c[m[n]]>1)m[n]=b27Key(n)});return m}
const b27PoolKeyList=()=>{const ns=b27OwnerNames(),k=b27PoolKeys(ns);return ns.map(n=>k[n]).join(', ')};
/* amounts: the old form's own shorthand (K / mil / juta ...) via parseAmount, but a bare number stays as typed ("50" = 50); whole numbers only */
function b27PoolNum(s){const v=parseAmount(String(s==null?'':s).trim(),false);return v!==null&&Number.isInteger(v)&&v>=0&&v<=POOL_MAX?v:null}
/* parts = everybody in the pool; buyTxt = entry each text; txt = amounts-back text. -> {ok,err} or {ok:true,amt,back:null|{name:n}} */
function b27PoolParse(parts,buyTxt,txt){
  if(parts.length<2)return {ok:false,err:PT('ePeople')};
  if(!String(buyTxt==null?'':buyTxt).trim())return {ok:false,err:PT('eBuy')};
  const amt=b27PoolNum(buyTxt);if(amt===null||amt<PULK.minAmt)return {ok:false,err:amt===null&&parseAmount(String(buyTxt).trim(),false)===null?PT('eBuy'):PT('eBuyMin',{min:PULK.minAmt})};
  const sz=amt*parts.length;let back=null;
  if(String(txt==null?'':txt).trim()){
    const names=b27OwnerNames(),keys=b27PoolKeys(names);back={};
    for(const raw of String(txt).split(/[,;\n]+/)){const x=raw.trim();if(!x)continue;const i=x.search(/[:=]/);if(i<1)return {ok:false,err:PT('eFmt')};
      const k=b27Key(x.slice(0,i)),vv=x.slice(i+1).trim();
      const hit=names.filter(n=>keys[n]===k||b27Key(n)===k||b27Key(String(n).split(/\s+/)[0])===k);
      if(hit.length!==1)return {ok:false,err:PT('eUnknown',{x:x.slice(0,i).trim(),keys:b27PoolKeyList()})};
      const who=hit[0];if(!parts.includes(who))return {ok:false,err:PT('eNotIn',{x:who})};
      if(Object.prototype.hasOwnProperty.call(back,who))return {ok:false,err:PT('eDup',{x:who})};
      const v=b27PoolNum(vv);if(v===null)return {ok:false,err:PT('eBadPay')};back[who]=v}
    for(const p of parts)if(!Object.prototype.hasOwnProperty.call(back,p))back[p]=0;
    const tot=parts.reduce((s,p)=>s+back[p],0);if(tot!==sz)return {ok:false,err:PT('eSum',{sum:b27Num(tot),total:b27Num(sz)})};
  }
  return {ok:true,amt,back};
}

/* Pool form as labeled steps: 1 Terms, 2 Who's in, 3 Buy-in (live pot line), 4 Payouts by PLACE (amounts only, no names).
   New optional record field places:[amount by place] (Winner first), must add up to the pot. At settle time the creator picks a participant
   for each place; that becomes the usual back:{name:amount} (same field/format old pools use), so totals, owes and old pools are unchanged.
   Old pools without places keep the old name:amount box. Payouts are optional: leave every place blank for an open pool. */
const S26F_PL=['Winner','2nd','3rd','4th','5th','6th','7th','8th','9th','10th'];
const s26fPlaceName=i=>S26F_PL[i]||((i+1)+'th');
if(!Array.isArray(U.places))U.places=['',''];
function s26fPoolCheck(){const e={},parts=b27PoolParts();
  if(!b27Clean(U.text))e.terms=PT('eTerms');
  if(parts.length<2)e.people=PT('ePeople');
  let amt=null;const bt=String(U.entry==null?'':U.entry).trim();
  if(!bt)e.buy=PT('eBuy');else{amt=b27PoolNum(bt);if(amt===null||amt<PULK.minAmt){e.buy=amt===null&&parseAmount(bt,false)===null?PT('eBuy'):PT('eBuyMin',{min:PULK.minAmt});amt=null}}
  const pot=amt!==null&&parts.length>=1?amt*parts.length:null;
  const vals=U.places.map(s=>String(s==null?'':s).trim());let places=null,sum=0,bad=false;
  vals.forEach(v=>{if(!v)return;const n=b27PoolNum(v);if(n===null)bad=true;else sum+=n});
  if(bad)e.pay=PT('ePlaceNum');
  else if(vals.some(Boolean)){places=vals.map(v=>v?b27PoolNum(v):0);while(places.length&&!places[places.length-1])places.pop();
    if(pot!==null&&sum!==pot)e.pay=PT('ePlaceSum',{sum:b27Num(sum),pot:b27Num(pot),diff:b27Num(Math.abs(pot-sum)),way:sum<pot?PT('short'):PT('over')})}
  return {e,parts,amt,pot,sum,places:places&&places.length?places:null}}
const s26fFirstErr=c=>c.e.terms||c.e.people||c.e.buy||c.e.pay||'';
function s26fPotLine(c){return c.pot!==null?PT('potLine',{n:c.parts.length,buy:b27Num(c.amt),pot:b27Num(c.pot)}):PT('potWait')}
function s26fSumLine(c){if(c.pot===null||!U.places.some(s=>String(s).trim()))return PT('payOpt');return PT('sumLine',{sum:b27Num(c.sum),pot:b27Num(c.pot)})+(c.sum===c.pot?' ✓':'')}
function s26fPlaceRows(){return U.places.map((v,i)=>`<div class="s26pr"><label for="s26p${i}" class="s26pl">${esc(s26fPlaceName(i))}</label><input maxlength="8" id="s26p${i}" class="sb-in s26pi" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(v)}" oninput="U.places[${i}]=this.value;b27PSync()">${i>=2?`<button type="button" class="s26px" aria-label="Remove ${esc(s26fPlaceName(i))}" onclick="s26fDelPlace(${i})">×</button>`:'<span class="s26px0"></span>'}</div>`).join('')}

  set('s26ePay',c.e.pay&&(sh.pay||c.e.pay)?c.e.pay:'');set('s26Pot',s26fPotLine(c));set('s26Sum',s26fSumLine(c));

function s26fPlaceGo(id){const b=U.doc.bets.find(x=>x.id===id);if(!b||!b.places)return;const sel=U.placeWho[id]||[];

/* settle-up from nets [[name,net],...] (sum 0): the biggest loser owes the biggest winner, repeat */
function b27Greedy(nets){const d=nets.filter(x=>x[1]<0).map(x=>[x[0],-x[1]]),c=nets.filter(x=>x[1]>0).map(x=>[x[0],x[1]]),out=[];const srt=a=>a.sort((p,q)=>q[1]-p[1]||p[0].localeCompare(q[0]));
  while(d.length&&c.length){srt(d);srt(c);const m=Math.min(d[0][1],c[0][1]);out.push({from:d[0][0],to:c[0][0],num:m});d[0][1]-=m;c[0][1]-=m;if(!d[0][1])d.shift();if(!c[0][1])c.shift()}
  return out}
const b27PoolNets=b=>b.parts.map(p=>[p,((b.back&&b.back[p])||0)-b.amt]);
function b27PoolValid(x,names){
  const n=Number(x.n),t=Date.parse(x.created_at),amt=Number(x.amt),backer=legacyOwner(x.backer),has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
  if(typeof x.id!=='string'||!/^[a-z0-9]{6,24}$/.test(x.id)||!Array.isArray(x.parts)||typeof x.text!=='string')return null;
  const parts=x.parts.map(legacyOwner);
  if(!names.includes(backer)||parts.length<2||parts.length>names.length||parts.some(p=>typeof p!=='string'||!names.includes(p))||new Set(parts).size!==parts.length)return null;
  if(!Number.isInteger(amt)||amt<PULK.minAmt||amt>POOL_MAX||!Number.isInteger(n)||n<1||!isFinite(t))return null;
  let back=null;
  if(x.back&&typeof x.back==='object'&&!Array.isArray(x.back)){const raw={};for(const k of Object.keys(x.back))raw[legacyOwner(k)]=x.back[k];const bk={};let ok=true;
    for(const k of Object.keys(raw)){if(!parts.includes(k)||!Number.isInteger(raw[k])||raw[k]<0||raw[k]>POOL_MAX)ok=false;else bk[k]=raw[k]}
    if(ok){parts.forEach(p=>{if(!has(bk,p))bk[p]=0});if(parts.reduce((s,p)=>s+bk[p],0)===amt*parts.length)back=bk}}
  return {id:x.id,n,kind:'pool',backer,parts,amt,back,/*<S29E-POSTED>*/...(typeof x.postedBy==='string'&&names.includes(legacyOwner(x.postedBy))?{postedBy:legacyOwner(x.postedBy)}:{}),...(x.postedAt&&isFinite(Date.parse(x.postedAt))?{postedAt:new Date(x.postedAt).toISOString()}:{}),/*</S29E-POSTED>*/text:b27Clean(x.text),created_at:new Date(t).toISOString(),status:['open','void'].includes(x.status)?x.status:'open',settled_at:x.settled_at&&isFinite(Date.parse(x.settled_at))?new Date(x.settled_at).toISOString():null/*<S26F-POOL>*/,...(Array.isArray(x.places)&&x.places.length&&x.places.length<=10&&x.places.every(v=>Number.isInteger(v)&&v>=0&&v<=POOL_MAX)&&x.places.reduce((s,v)=>s+v,0)===amt*parts.length?{places:x.places.slice()}:{})/*</S26F-POOL>*/, ...b27WhenFields(x)/*<S25C-RX>*/,...(s25ValidExtra(x,names,'open').rx?{rx:s25ValidExtra(x,names,'open').rx}:{})/*</S25C-RX>*/};
}
